<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}mmscan{% endblock %}</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #f0efeb; --ink: #14140f; --ink-2: #5a5953;
  --line: #e2e1db; --accent: #1f6feb; --accent-ink: #ffffff;
  --series-1: #1f6feb; --series-2: #e8642c;
  --good: #0b7a3b; --good-bg: #e3f4ea; --warn: #8a5a00; --warn-bg: #fbf0d6;
  --bad: #b3261e; --bad-bg: #fbe5e3; --mute-bg: #eeede8;
  --radius: 10px; --shadow: 0 1px 2px rgb(20 20 15 / .06);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #131312; --surface: #1c1c1b; --surface-2: #252524; --ink: #f0efec; --ink-2: #aaa9a0;
    --line: #333331; --accent: #5b9bff; --accent-ink: #0a0a0a;
    --series-1: #5b9bff; --series-2: #f08a5a;
    --good: #5dd68a; --good-bg: #16301f; --warn: #e6b450; --warn-bg: #33290f;
    --bad: #ff8a80; --bad-bg: #3a1a18; --mute-bg: #2a2a28;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1280px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
.brand svg { width: 22px; height: 22px; color: var(--accent); }
.topbar nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.topbar nav a { text-decoration: none; color: var(--ink-2); padding: 6px 12px; border-radius: 8px; font-weight: 500; }
.topbar nav a:hover { background: var(--surface-2); color: var(--ink); }
.topbar nav a.on { background: var(--surface-2); color: var(--ink); }
.topbar nav .sep { flex: 1; }
.topbar form { margin: 0; }

main { padding: 20px 16px 48px; max-width: 1280px; margin: 0 auto; }
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 16px; }
h1 { font-size: 24px; letter-spacing: -.02em; margin: 0; line-height: 1.2; }
h2 { font-size: 16px; margin: 28px 0 10px; letter-spacing: -.01em; }
.sub { color: var(--ink-2); font-size: 13px; }
.note { color: var(--ink-2); font-size: 13px; margin: 10px 0 14px; max-width: 80ch; }
.banner { background: var(--warn-bg); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
  border-radius: var(--radius); padding: 8px 12px; font-size: 13px; margin-bottom: 16px; }

/* controls */
select, input, button, .btn { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink); min-height: 36px; }
button, .btn { cursor: pointer; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .btn:hover { background: var(--surface-2); }
.btn.primary, button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover, button.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.sm { min-height: 28px; padding: 3px 10px; font-size: 13px; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: end;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.filters select { width: 100%; }
.filters .actions { display: flex; gap: 8px; }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.tile .k { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.tile .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 2px; }
.tile .d { font-size: 12px; color: var(--ink-2); }
.tile.good .v { color: var(--good); } .tile.warn .v { color: var(--warn); } .tile.bad .v { color: var(--bad); }

/* tables */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
thead th { font-size: 12px; color: var(--ink-2); font-weight: 600; background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
thead th:first-child { border-top-left-radius: var(--radius); } thead th:last-child { border-top-right-radius: var(--radius); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 4%, transparent); }
tbody tr:last-child td { border-bottom: 0; }
tr.partial td { background: var(--bad-bg); }
td.empty { text-align: center; color: var(--ink-2); padding: 32px 12px; }
.route a { font-weight: 600; text-decoration: none; color: var(--ink); white-space: nowrap; }
.route a:hover { color: var(--accent); text-decoration: underline; }
.total { font-weight: 700; font-size: 16px; }
.muted { color: var(--ink-2); font-size: 12px; }
.nowrap { white-space: nowrap; }

/* badges */
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px;
  font-weight: 600; background: var(--mute-bg); color: var(--ink-2); white-space: nowrap; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag.deal, .tag.ok { background: var(--good-bg); color: var(--good); }
.tag.worth { background: var(--warn-bg); color: var(--warn); }
.tag.partial, .tag.failed { background: var(--bad-bg); color: var(--bad); }
.tag.plain::before { display: none; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--mute-bg); color: var(--ink-2); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chg-down { color: var(--good); font-weight: 600; } .chg-up { color: var(--bad); font-weight: 600; }

/* deals */
.pos { color: var(--good); } .neg { color: var(--bad); }
.hero { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; align-items: center;
  background: var(--good-bg); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent);
  border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; }
.hero .k { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.hero .v { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; color: var(--good); }
.hero .stats { display: flex; gap: 28px; } .hero .stats b { font-size: 22px; display: block; }
.dealtab th, .dealtab td { padding: 7px 8px; font-size: 13px; }
.dealtab .verdict .tag { font-size: 11px; }
.mini { width: 64px; height: 8px; background: var(--mute-bg); border-radius: 4px; overflow: hidden; display: block; }
.mini i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.mini.neg i { background: var(--bad); }
.checks { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.checks label { flex-direction: row; align-items: center; gap: 6px; font-weight: 500; font-size: 13px; color: var(--ink); }
.checks input { min-height: 0; }
.flags { display: flex; gap: 4px; flex-wrap: wrap; }
/* trips: sparkline, calendar, budget */
.spark { width: 100%; height: auto; max-width: 420px; display: block; }
.spark .area { fill: color-mix(in srgb, var(--series-1) 14%, transparent); }
.spark .line { fill: none; stroke-width: 2.25; stroke-linejoin: round; } .spark .s1 { stroke: var(--series-1); }
.spark .end { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }
.triprow { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 0 0 16px; }
@media (max-width: 760px) { .triprow { grid-template-columns: 1fr; } }
.card2 { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.card2 h3 { margin: 0 0 6px; font-size: 14px; }
.budget { position: relative; margin: 14px 0 6px; }
.budget .mark { position: absolute; top: -4px; width: 2px; height: 20px; background: var(--ink); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { font-size: 11px; color: var(--ink-2); text-align: center; }
.cal .cell { min-height: 46px; border-radius: 6px; padding: 3px 2px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; font-size: 12px; line-height: 1.2; border: 1px solid transparent; font-variant-numeric: tabular-nums; }
.cal .cell small { font-size: 10px; color: var(--ink-2); }
.cal .none { background: var(--surface-2); color: var(--ink-2); opacity: .7; }
.cal .l0 { background: color-mix(in srgb, var(--good) 45%, var(--surface)); } .cal .l1 { background: color-mix(in srgb, var(--good) 22%, var(--surface)); }
.cal .l2 { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); } .cal .l3 { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.cal .l4 { background: color-mix(in srgb, var(--bad) 26%, var(--surface)); }
.cal .best { outline: 2px solid var(--ink); }
.calkey { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.calkey i { width: 18px; height: 10px; border-radius: 3px; display: inline-block; }
/* percentile bar: left = cheaper than most of this route's history */
.pct { display: flex; align-items: center; gap: 8px; min-width: 96px; }
.pct .bar { flex: 1; height: 6px; background: var(--mute-bg); border-radius: 3px; overflow: hidden; }
.pct .bar i { display: block; height: 100%; background: var(--good); border-radius: 3px; }

/* meter */
.meter { height: 12px; background: var(--mute-bg); border-radius: 6px; overflow: hidden; }
.meter > div { height: 100%; background: var(--accent); border-radius: 6px; }
.meter.warn > div { background: var(--warn); } .meter.bad > div { background: var(--bad); }

/* charts */
.chart-wrap { padding: 12px 12px 8px; }
.chart { width: 100%; height: auto; max-width: 820px; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--ink-2); font-size: 11px; }
.chart .label { fill: var(--ink); font-size: 12px; font-weight: 600; }
.chart .line { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.chart .s1 { stroke: var(--series-1); } .chart .s2 { stroke: var(--series-2); }
.chart circle.end.s1 { fill: var(--series-1); } .chart circle.end.s2 { fill: var(--series-2); }
.chart .end { stroke: var(--surface); stroke-width: 2; }
.chart .usual { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .hit { fill: transparent; cursor: crosshair; }
.legend { display: flex; gap: 16px; padding: 0 14px 12px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg);
  padding: 6px 10px; border-radius: 6px; font-size: 13px; display: none; max-width: 280px; z-index: 20; }
details summary { cursor: pointer; color: var(--ink-2); padding: 10px 14px; font-weight: 500; }
details[open] summary { border-bottom: 1px solid var(--line); }

/* login */
.login { min-height: 70vh; display: grid; place-items: center; }
.login .card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 28px 24px; box-shadow: var(--shadow); }
.login .brand { font-size: 20px; margin-bottom: 4px; } .login .brand svg { width: 28px; height: 28px; }
.login form { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
.login label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.err { color: var(--bad); background: var(--bad-bg); padding: 8px 10px; border-radius: 8px; font-size: 13px; }

/* phones: rows become cards */
@media (max-width: 760px) {
  main { padding-top: 14px; }
  .topbar-in { padding: 8px 12px 0; }
  .brand { order: 1; flex: 1; }
  .topbar form { order: 2; }
  .topbar nav { order: 3; flex: 0 0 100%; flex-wrap: nowrap; overflow-x: auto; margin: 0 -12px; padding: 0 12px 8px; }
  .topbar nav a { white-space: nowrap; }
  .topbar nav .sep { display: none; }
  table.cards td > span:not(.tag):not(.chip), table.cards td > div { text-align: right; }
  table.cards td .pct { min-width: 0; width: 60%; }
  h1 { font-size: 21px; }
  table.cards, table.cards tbody, table.cards tr, table.cards td { display: block; width: 100%; }
  table.cards thead { position: absolute; left: -9999px; }
  table.cards tbody tr { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  table.cards tbody tr:last-child { border-bottom: 0; }
  table.cards td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
  table.cards td::before { content: attr(data-label); color: var(--ink-2); font-size: 12px; font-weight: 600; text-align: left; flex: none; }
  table.cards td.empty { display: block; text-align: center; }
  table.cards td.empty::before, table.cards td:not([data-label])::before { content: none; }
  table.cards td.n { text-align: right; }
  .tile .v { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  .meter > div { transition: width .4s ease; }
}
.tag.ok { color: var(--good); border-color: var(--good); }
.tag.over { color: var(--bad); border-color: var(--bad); }
.trip { margin: 0 0 28px; }
.trip h2 { font-size: 17px; margin: 0 0 2px; }
.trip .meta { color: var(--ink-2); font-size: 13px; margin: 0 0 8px; }
.trip .best { background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 14px; margin: 0 0 10px; }
.trip .best b { font-size: 18px; }
td small { color: var(--ink-2); }
</style>
</head>
<body>
{% if page != "login" %}
<div class="topbar"><div class="topbar-in">
  <a class="brand" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
    mmscan
  </a>
  <nav aria-label="Main">
    <a href="/" class="{{ 'on' if page in ('deals', 'route') }}">Best deals</a>
    <a href="/trips" class="{{ 'on' if page == 'trips' }}">My trips</a>
    <a href="/shortlist" class="{{ 'on' if page == 'shortlist' }}">Shortlist</a>
    <a href="/data" class="{{ 'on' if page in ('data', 'runs', 'quota') }}">Data &amp; alerts</a>
    <span class="sep"></span>
    <a href="/reports/latest.xlsx" title="Download the latest report as Excel">Excel ↓</a>
    <a href="/reports/latest-shortlist.csv" title="Download the shortlist as CSV">CSV ↓</a>
  </nav>
  <form method="post" action="/logout"><button type="submit" class="btn sm">Log out</button></form>
</div></div>
{% endif %}
<main>
{% block body %}{% endblock %}
</main>
<div id="tip"></div>
<script>
const tip = document.getElementById("tip");
document.addEventListener("pointerover", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip; tip.style.display = "block";
});
document.addEventListener("pointermove", e => {
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 300) + "px";
  tip.style.top = e.clientY + 14 + "px";
});
</script>
</body>
</html>
