source: lufthansa
cabins: [economy, business]
min_seats: 2

# What one mile costs you, in euro cents. Turns miles into euros.
mile_cost_eur_cents: 1.16

# seats.aero reports Miles & More fees in USD. Fixed rate, euro per dollar; update it now and
# then. Fees run 30-700 EUR, so a few percent of drift barely moves a total. Without it, USD
# fees are unpriced and the Shortlist stays empty.
usd_to_eur: 0.92

date_window:
  start_offset_days: 0
  end_offset_days: 330

region_pairs:
  - {origin: Europe, destination: Asia}
  - {origin: Asia, destination: Europe}

watchlist:
  origins: [MUC, FRA, ZRH, VIE, BRU]
  destinations: [SIN, KUL, BKK, MNL]
  both_directions: true

# The API's regions are continents. Subregions refine them by airport list.
subregions:
  southeast_asia: [SIN, KUL, BKK, MNL, CGK, SGN, HAN, DPS, HKT, PEN, CEB]

# Fallback ceilings, used when a baseline has too little data.
# A place in "between" is an API region name or a subregion key.
# chart_rate_miles is half the official return price for partner awards.
benchmarks:
  - name: economy_europe_southeast_asia
    cabin: economy
    between: [Europe, southeast_asia]
    good_miles_max: 25000
    chart_rate_miles: 42500
    fees_max_eur: 280
  - name: business_europe_southeast_asia
    cabin: business
    between: [Europe, southeast_asia]
    good_miles_max: 60000
    chart_rate_miles: 100000
    fees_max_eur: 450

relative:
  percentile_good: 20
  min_samples: 15
  history_days: 30
  # A deal must also be at least this % below the median total of its route/destination, so a
  # route whose price barely moves has no deals. 0 = off (plain percentile cut).
  min_discount_pct: 10

prescreen:
  percentile: 30

enrich:
  max_calls: 150

value_per_mile_cents:
  good: 2.0
  fair: 1.5
  poor: 1.2

api:
  take: 1000
  min_cabin_pct: 100
  include_filtered: false
  daily_call_cap: 300

output:
  dir: ./reports
  formats: [xlsx, csv]

# Two ways to be a Deal besides the relative baselines above:
#   by_ceiling: miles and fees within the matching benchmark's good_miles_max and fees_max_eur
#   (an absolute price). A route whose fare never moves can still be a Deal this way.
deals:
  by_ceiling: true

# Change = "Cheaper" when a total fell this % or more since the result was last seen.
drops:
  min_pct: 5

# What reaches the Shortlist, the shortlist CSV and Slack. focus = results that match a
# benchmark above (Europe <-> southeast_asia) or a watchlist airport pair; all = everything
# scored a Deal or Worth a look. "All results" always has every result either way.
shortlist:
  scope: focus
  focus_watchlist: true

# Slack alerts after `mmscan run` or `mmscan notify`. The webhook URL is a
# secret: put it in .env as SLACK_WEBHOOK_URL, never here. Only results that
# match both lists are posted; nothing is posted when none match.
notify:
  slack: false
  on_drop: true   # also alert on Cheaper results of any verdict (inside the shortlist scope)
  verdicts: [Deal]
  changes: [New, Cheaper]
  max_items: 10

# `mmscan watch`: watchlist only, for frequent runs. Results come cheapest
# first, so one page (api.take results) per direction holds the deals.
# Calls per watch run: 2 x max_pages.
watch:
  max_pages: 1

# Trips you actually want to take. Each one gets its own narrow searches every scan, outbound and
# return legs paired into round trips, a page in the dashboard (/trips) and Slack alerts on its
# best options. Leave out `return` for a one-way trip. Remove the leading # to switch one on.
# trips:
#   - name: Family stay Philippines
#     origins: [BRU, FRA]
#     destinations: [MNL, CEB]
#     depart: {start: 2027-06-01, end: 2027-06-20}
#     return: {start: 2027-08-15, end: 2027-08-31}
#     stay_days: {min: 40, max: 90}   # optional
#     cabins: [economy]               # default: top-level cabins
#     seats: 2                        # default: min_seats
#     max_stops: 1                    # optional
#     max_total_eur: 3000             # optional: whole trip, all travellers
#     open_jaw: false                 # true: return from another airport / to another origin
#     alert_top: 3                    # Slack: new or cheaper among the best N options
# trip_freshness_hours: 72            # ignore results from runs older than this
